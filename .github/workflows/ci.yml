name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  build-test:
    uses: DavidArthurCole/EggIdentity/.github/workflows/dotnet-ci.yml@main
    with:
      solution: EggLedger.slnx
      packages-auth: true
      format-gate: true
      razor-include: "**/*.razor"
    secrets:
      PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}

  fast-deploy:
    needs: build-test
    if: github.event_name == 'push'
    uses: DavidArthurCole/EggIdentity/.github/workflows/fast-deploy-trigger.yml@main
    with:
      app: EggLedger
      agent-url: https://eggidentity.davidarthurcole.me/agent
    secrets:
      deploy-secret: ${{ secrets.LEDGER_DEPLOY_SECRET }}

  warm-release-cache:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Authenticate GitHub Packages
        shell: bash
        run: |
          dotnet nuget update source github \
            --username ${{ github.repository_owner }} \
            --password ${{ github.token }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Warm caches via desktop publish
        shell: bash
        run: |
          dotnet publish EggLedger.Desktop/EggLedger.Desktop.csproj \
            -c Release -r ${{ matrix.os == 'windows-latest' && 'win-x64' || startsWith(matrix.os, 'macos') && 'osx-arm64' || 'linux-x64' }} \
            --self-contained true -o publish/warm
